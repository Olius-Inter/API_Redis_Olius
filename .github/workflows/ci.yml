name: Redis API CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  redis-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify with disposable PostgreSQL and Redis
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Build runtime image
        run: docker build --tag olius-redis-api:ci .
